# Render free-tier notes (see P6 in docs/member3-backend-build-plan.md):
#   - The web service sleeps after ~15 min idle; first request after sleep
#     can take up to a minute. Client retry/timeout (app side, 1.6) and the
#     opportunistic timeout sweep on GET /payments/{id} both cover this.
#   - The periodic in-process timeout sweeper does not run while the
#     service sleeps; sweep_if_stale() re-evaluates on read instead.
#   - Free Postgres has a time-limited free period and free Key Value is
#     not durable — export the database before any live demo.
databases:
  - name: satark-db
    plan: free
    databaseName: satark
    user: satark

services:
  - type: web
    name: satark-server
    runtime: docker
    repo: https://github.com/devmatrixpublic-ctrl/sartak
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SATARK_ENV
        value: production
      - key: SATARK_DATABASE_URL
        fromDatabase:
          name: satark-db
          property: connectionString
      # Migrations use this owner connection; once ops/security/db_roles.sql has been run, point
      # SATARK_DATABASE_URL at the DML-only `satark_app` role in the Render dashboard.
      - key: SATARK_MIGRATION_DATABASE_URL
        fromDatabase:
          name: satark-db
          property: connectionString
      - key: SATARK_REDIS_URL
        fromService:
          type: keyvalue
          name: satark-cache
          property: connectionString
      - key: SATARK_JWT_SECRET
        generateValue: true
      # Device auth (Member 4, contracts/auth.md). The server refuses to boot in
      # production until the pinned Google roots are committed at
      # server/certs/google_attestation_roots.pem and the two values below are set.
      - key: SATARK_AUTH_ATTESTATION_ROOTS
        value: /srv/certs/google_attestation_roots.pem
      - key: SATARK_AUTH_EXPECTED_PACKAGE
        sync: false
      - key: SATARK_AUTH_EXPECTED_SIGNING_SHA256
        sync: false
      # Secrets below are not generated by the blueprint; set them in the
      # Render dashboard after the first deploy.
      - key: SATARK_RAZORPAY_KEY_ID
        sync: false
      - key: SATARK_RAZORPAY_KEY_SECRET
        sync: false
      - key: SATARK_RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SATARK_FIREBASE_CREDENTIALS_JSON
        sync: false

  - type: keyvalue
    name: satark-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
