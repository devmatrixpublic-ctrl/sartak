name: Release

# On main (plan 4.2): refuse to ship while stubs remain or the evaluation gate fails, then build the
# server image, deploy to Render, and build the signed APK when an Android project exists.
# Needs secrets/variables listed in ops/ci/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate (no stubs, evaluation passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ops/requirements-eval.txt
      - name: No temporary stubs may remain
        run: python ops/ci/check_stubs.py .
      - run: pip install -r ops/requirements-eval.txt
      - name: Evaluation gate is enforced on release
        run: python ops/eval/run_eval.py
      - name: Strings are valid
        run: python ops/strings/validate_strings.py

  server-image:
    name: Build server image and deploy to Render
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t satark-server:${{ github.sha }} server
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set; cannot deploy"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "deploy triggered for ${{ github.sha }}"

  android-release:
    name: Signed release APK (skipped until app/ exists)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there an Android project yet?
        id: has_app
        run: |
          if [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::no app/ Gradle project yet; APK build skipped"; fi
      - uses: actions/setup-java@v4
        if: steps.has_app.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.has_app.outputs.present == 'true'
      - name: Decode keystore from secrets (never written into the repo)
        if: steps.has_app.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.has_app.outputs.present == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: steps.has_app.outputs.present == 'true'
        with:
          name: satark-release-apk
          path: app/build/outputs/apk/release/*.apk
